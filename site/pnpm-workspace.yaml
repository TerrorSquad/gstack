# Makes site/ its own pnpm workspace root. Without this, pnpm walks up, finds the
# starter's pnpm-workspace.yaml, decides site/ is an unlisted member of THAT
# workspace, and installs nothing. The docs site must resolve independently — its
# deps are not the starter's deps.
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Hoist docus's dependencies into site/node_modules. Nuxt loads modules by name; one that isn't hoisted here is
# looked up in the parent directory and resolves to the starter's copy (a different major: nuxt-og-image 7,
# @nuxtjs/sitemap 9), which breaks generate.
shamefullyHoist: true
