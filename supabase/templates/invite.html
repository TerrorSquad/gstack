<!doctype html>
<html lang="en">
  <body
    style="margin: 0; padding: 0; background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0f172a"
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f1f5f9; padding: 24px 0">
      <tr>
        <td align="center">
          <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="max-width: 520px; width: 100%; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px">
            <tr>
              <td style="padding: 24px 32px; text-align: center">
                <span style="color: #b45309; font-weight: 700; font-size: 18px">GStack</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px; text-align: center">
                <div style="display: inline-block; width: 56px; height: 56px; line-height: 56px; border-radius: 50%; background: #fffbeb; color: #b45309; font-size: 26px">✉</div>
                <h1 style="margin: 16px 0 8px; font-size: 20px; color: #0f172a">You've been invited</h1>
                <p style="margin: 0 0 8px; color: #475569; font-size: 14px">
                  You've been invited to join GStack. Accept the invitation below to set your password and get started.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px; text-align: center">
                <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #b45309; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px">Accept invitation</a>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 24px; text-align: center">
                <span style="color: #b45309; font-weight: 700; font-size: 14px">GStack</span>
                <p style="margin: 6px 0 0; color: #94a3b8; font-size: 11px">If you weren't expecting this invitation, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
