name: ci

on:
  push:
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools (node + pnpm from mise.toml)
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: i18n check
        run: pnpm run lint:i18n

      - name: i18n key usage check
        run: pnpm run lint:i18n-keys

      - name: Unit tests + coverage gate (vitest)
        run: pnpm run test:coverage

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        # Runners default Node to a ~2GB old-space; the Nitro build (Sentry's
        # rollup plugin + source maps) exceeds it and dies with an OOM that looks
        # like a code failure. Dev machines don't hit this because their default
        # heap is larger, so it only ever reproduces in CI.
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm run build
