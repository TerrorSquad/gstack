name: e2e-a11y

# Runs on a schedule instead of every push — the full Playwright + a11y suite
# (Supabase start, build, seed) is too slow/expensive to run per-commit.
# Push-triggered checks (lint, unit tests, typecheck) stay in ci.yml.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-a11y:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools (node + pnpm from mise.toml)
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Cache hit still needs the OS libs (--with-deps); browser binaries are restored.
      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install chromium --with-deps
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Restore the Supabase service images (postgres, gotrue, etc.) — the bulk
      # of "supabase start" was a cold `docker pull`. Keyed on the CLI version so
      # a CLI bump (which can change pinned image tags) busts the cache.
      - name: Cache Supabase Docker images
        uses: actions/cache@v4
        with:
          path: ~/supabase-images.tar
          key: supabase-images-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load cached Supabase images
        run: |
          if [ -f ~/supabase-images.tar ]; then
            docker load -i ~/supabase-images.tar
          fi

      - name: Start local Supabase
        run: supabase start

      - name: Save Supabase images to cache
        run: |
          if [ ! -f ~/supabase-images.tar ]; then
            docker images --filter=reference='public.ecr.aws/supabase/*' --format '{{.Repository}}:{{.Tag}}' > /tmp/imgs.txt
            docker images --filter=reference='supabase/*' --format '{{.Repository}}:{{.Tag}}' >> /tmp/imgs.txt
            xargs docker save -o ~/supabase-images.tar < /tmp/imgs.txt || true
          fi

      - name: Apply migrations
        run: supabase db reset

      - name: Set Supabase credentials
        run: |
          STATUS=$(supabase status --output env)
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "SUPABASE_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV

      - name: Build app (production)
        run: touch .env && pnpm build
        env:
          # Nuxt/Vite prod build peaks past Node's ~2 GB default old-space on the runner.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Seed database
        run: pnpm seed
        env:
          SEED_FAST: 0

      - name: Run e2e + a11y tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
