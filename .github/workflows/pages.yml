name: Deploy docs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'

# One deploy at a time; don't cancel a running one, or Pages can land a partial
# upload as the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          working_directory: site
          install: true

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Reads the existing Pages config. Note `enablement: true` does NOT work
      # here: creating a Pages site needs repo admin rights, which GITHUB_TOKEN
      # never has regardless of the `permissions:` block. Pages has to be turned
      # on once, out of band, per repo:
      #
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      #
      # (or Settings → Pages → Source: GitHub Actions). It also requires a public
      # repo on the free plan.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
