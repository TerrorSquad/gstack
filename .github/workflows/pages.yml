name: Deploy docs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'

# One deploy at a time; don't cancel a running one, or Pages can land a partial
# upload as the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages needs pages:write to turn Pages on via `enablement` below.
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          working_directory: site
          install: true

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # enablement: true turns Pages on the first time this runs, so a fork or a
      # repo made from this template doesn't need anyone to click through
      # Settings before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
