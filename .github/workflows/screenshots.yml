name: visual-regression

# PR-scoped, not push/schedule: this repo has limited Actions minutes and the
# full Playwright + Supabase + build run is expensive. UI regressions originate
# in app/**, so gate on PRs touching it, plus manual dispatch.
on:
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools (node + pnpm from mise.toml)
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install chromium --with-deps
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Cache Supabase Docker images
        uses: actions/cache@v4
        with:
          path: ~/supabase-images.tar
          key: supabase-images-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load cached Supabase images
        run: |
          if [ -f ~/supabase-images.tar ]; then
            docker load -i ~/supabase-images.tar
          fi

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations
        run: supabase db reset

      - name: Set Supabase credentials
        run: |
          STATUS=$(supabase status --output env)
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "SUPABASE_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV

      - name: Build app (production)
        run: touch .env && pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Seed database
        run: pnpm seed
        env:
          SEED_FAST: 0

      - name: Run visual-regression screenshots
        run: pnpm screenshots

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
